        let wordIndex = 0;
        let charIndex = 0;
        let deleting = false;

        function newTypewriter() {

            const word = newWords[wordIndex];

            if (!deleting) {
                typewriter.textContent =
                    word.substring(0, charIndex + 1);

                charIndex++;

                if (charIndex === word.length) {
                    deleting = true;
                    setTimeout(newTypewriter, 1800);
                    return;
                }

                setTimeout(newTypewriter, 90);

            } else {

                typewriter.textContent =
                    word.substring(0, charIndex - 1);

                charIndex--;

                if (charIndex === 0) {
                    deleting = false;
                    wordIndex =
                        (wordIndex + 1) % newWords.length;

                    setTimeout(newTypewriter, 500);
                    return;
                }

                setTimeout(newTypewriter, 45);
            }
